<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>DKVL STUDIO | BXH</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      color: #fff;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #25205a 0, transparent 38%),
        linear-gradient(135deg, #080b16, #10152a);
    }

    .hero {
      text-align: center;
      padding: 65px 20px 35px;
    }

    .hero h1 {
      font-size: clamp(38px, 8vw, 76px);
      font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(90deg, #00eaff, #a855f7, #ff3cac);
      background-size: 200% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .hero p {
      margin-top: 15px;
      color: #aab3d0;
      letter-spacing: 4px;
    }

    .toolbar {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      display: flex;
      gap: 15px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
      padding: 15px 20px;
      border: 1px solid #343b61;
      border-radius: 14px;
      outline: none;
      color: white;
      background: #151a30;
    }

    .gallery {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }

    .card {
      padding: 12px;
      border: 1px solid #343b61;
      border-radius: 18px;
      background: linear-gradient(145deg, #171d35, #0d1122);
      transition: .3s;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #00eaff;
      box-shadow: 0 10px 35px #00eaff25;
    }

    .brand {
      text-align: center;
      padding: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #00eaff;
      text-shadow: 0 0 15px #00eaff;
    }

    .card img {
      width: 100%;
      display: block;
      border-radius: 12px;
      object-fit: contain;
      cursor: pointer;
    }

    .card h3 {
      text-align: center;
      padding: 15px 5px 8px;
    }

    .watermark {
      pointer-events: none;
      position: relative;
    }

    .watermark::after {
      content: "DKVL STUDIO";
      position: absolute;
      bottom: 20px;
      right: 18px;
      color: #ffffffa0;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #000;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <h1>DKVL STUDIO</h1>
    <p>PREMIUM BXH ARCHIVE</p>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Tìm kiếm BXH...">
    <span id="counter">Đang tải BXH...</span>
  </div>

  <main class="gallery" id="gallery"></main>

  <script>
    const gallery = document.getElementById("gallery");
    const search = document.getElementById("search");
    const counter = document.getElementById("counter");

    // Tự động tìm ảnh từ 1.png đến 200.png
    const images = [];

    for (let i = 1; i <= 200; i++) {
      images.push({
        name: `BXH ${i}`,
        src: `${i}.png`
      });
    }

    function render(list) {
      gallery.innerHTML = "";

      list.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const brand = document.createElement("div");
        brand.className = "brand";
        brand.textContent = "✦ DKVL STUDIO ✦";

        const image = document.createElement("img");
        image.src = item.src;
        image.alt = item.name;
        image.loading = "lazy";
        image.draggable = false;

        image.onerror = () => card.remove();

        const title = document.createElement("h3");
        title.textContent = item.name;

        const wrapper = document.createElement("div");
        wrapper.className = "watermark";
        wrapper.appendChild(image);

        card.append(brand, wrapper, title);
        gallery.appendChild(card);
      });

      counter.textContent = `${list.length} BXH`;
    }

    search.addEventListener("input", () => {
      const keyword = search.value.toLowerCase();

      render(images.filter(item =>
        item.name.toLowerCase().includes(keyword)
      ));
    });

    document.addEventListener("contextmenu", event => {
      if (event.target.tagName === "IMG") {
        event.preventDefault();
      }
    });

    document.addEventListener("dragstart", event => {
      if (event.target.tagName === "IMG") {
        event.preventDefault();
      }
    });

    render(images);
  </script>
</body>
</html>
