<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG XẾP HẠNG NDK BOT</title>
    <!-- Font chữ Sci-Fi Cyberpunk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #05070e;
            --card-bg: rgba(10, 16, 28, 0.85);
            --border-color: #122035;
            --border-cyan: rgba(0, 240, 255, 0.3);
            --primary-cyan: #00f0ff;
            --btn-blue: #0077ff;
            --text-main: #d0dbe7;
            --text-dim: #5a6e85;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main); 
            padding: 20px 15px; 
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Container tổng */
        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Bộ đếm góc trên */
        .counter-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .counter-badge {
            background: #09172a;
            border: 1px solid var(--border-cyan);
            color: var(--primary-cyan);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        /* Thanh tiêu đề & Ô tìm kiếm */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            color: #8a9eb5;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: #080f1d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px 8px 36px;
            border-radius: 20px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 13px;
            outline: none;
            width: 200px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            opacity: 0.6;
        }

        /* Danh sách BXH */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .image-container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .image-container:hover {
            border-color: var(--border-cyan);
            background: rgba(12, 22, 38, 0.95);
        }

        .item-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-prefix {
            font-size: 12px;
            color: var(--text-dim);
            font-family: monospace;
        }

        .img-wrapper {
            position: relative;
            width: 140px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            background: #02050a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            padding-top: 10px;
        }

        .item-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .item-tag {
            background: #0d223a;
            border: 1px solid #1a426d;
            color: var(--primary-cyan);
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
        }

        /* Khung NDKBOT THANK YOU ở cuối danh sách */
        .footer-thankyou {
            margin: 40px auto 30px auto;
            padding: 18px;
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed var(--border-cyan);
            border-radius: 8px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* Lightbox phóng to ảnh */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(2, 4, 10, 0.95);
            backdrop-filter: blur(12px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000; 
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 90%;
            max-height: 85vh;
            border: 1px solid var(--primary-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            border-radius: 6px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--primary-cyan);
            font-size: 36px;
            cursor: pointer;
        }

        #devtools-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #02040a;
            color: var(--primary-cyan);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <div id="devtools-warning">
        <p>⚠️ ACCESS DENIED / DEVTOOLS DETECTED</p>
    </div>

    <div class="app-container">
        <!-- Khối hiển thị số lượng góc trên -->
        <div class="counter-header">
            <div class="counter-badge" id="counter">Đang kiểm tra...</div>
        </div>

        <!-- Thanh Tiêu đề & Ô Tìm kiếm -->
        <div class="top-bar">
            <div class="header-title">LỊCH SỬ BẢNG XẾP HẠNG</div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm số BXH..." oninput="filterBXH()">
            </div>
        </div>

        <!-- Danh sách chứa các BXH -->
        <div class="gallery" id="gallery-container"></div>

        <!-- Khối thông điệp NDKBOT THANK YOU ở cuối -->
        <div class="footer-thankyou" id="thankyou-block" style="display: none;">
            NDKBOT THANK YOU
        </div>
    </div>

    <!-- Lightbox Xem Ảnh Phóng To -->
    <div class="lightbox-overlay" id="lightbox">
        <span class="close-lightbox" id="close-btn">&times;</span>
        <img src="" alt="BXH Chi Tiết" class="lightbox-image" id="lightbox-img">
    </div>

    <script>
        const BATCH_SIZE = 10; // Quét 10 ảnh cùng lúc để tối ưu tốc độ
        const gallery = document.getElementById('gallery-container');
        const counterEl = document.getElementById('counter');
        const thankyouBlock = document.getElementById('thankyou-block');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        let totalLoaded = 0;

        // Thử nghiệm kiểm tra định dạng .png hoặc .jpg cho từng ảnh
        function testImageSrc(index) {
            return new Promise((resolve) => {
                const pngSrc = `${index}.png`;
                const jpgSrc = `${index}.jpg`;

                const imgPng = new Image();
                imgPng.onload = () => resolve(pngSrc);
                imgPng.onerror = () => {
                    const imgJpg = new Image();
                    imgJpg.onload = () => resolve(jpgSrc);
                    imgJpg.onerror = () => resolve(null);
                    imgJpg.src = jpgSrc;
                };
                imgPng.src = pngSrc;
            });
        }

        // Tải động KHÔNG GIỚI HẠN - Quét liên tục đến khi hết ảnh trong thư mục
        async function loadAllImagesDynamically() {
            let currentIndex = 1;
            let keepScanning = true;

            while (keepScanning) {
                const batchPromises = [];
                for (let i = 0; i < BATCH_SIZE; i++) {
                    batchPromises.push(testImageSrc(currentIndex + i));
                }

                const results = await Promise.all(batchPromises);

                for (let i = 0; i < results.length; i++) {
                    const validSrc = results[i];
                    const itemIndex = currentIndex + i;

                    if (validSrc) {
                        totalLoaded++;
                        const div = document.createElement('div');
                        div.className = 'image-container';
                        div.setAttribute('data-index', itemIndex);

                        div.innerHTML = `
                            <div class="item-left">
                                <span class="file-prefix">»</span>
                                <div class="img-wrapper" onclick="openLightbox('${validSrc}')">
                                    <img src="${validSrc}" alt="BXH #${itemIndex}" loading="lazy">
                                    <span class="image-number">${itemIndex}</span>
                                </div>
                            </div>
                            <div class="item-right">
                                <div class="item-title">BXH #${itemIndex}</div>
                                <span class="item-tag">BXH #${itemIndex}</span>
                            </div>
                        `;
                        gallery.appendChild(div);
                    } else {
                        // Phát hiện hết ảnh trong thư mục -> Dừng quét
                        keepScanning = false;
                        break;
                    }
                }

                currentIndex += BATCH_SIZE;
                updateCounter(totalLoaded, totalLoaded);
            }

            // Hiện khối NDKBOT THANK YOU ở cuối danh sách sau khi đã quét xong
            if (totalLoaded > 0) {
                thankyouBlock.style.display = 'block';
            } else {
                counterEl.innerText = "0 / 0 bảng";
            }
        }

        function updateCounter(visible, total) {
            counterEl.innerText = `${visible} / ${total} bảng`;
        }

        // Lọc hiển thị khi nhập số trong ô tìm kiếm
        function filterBXH() {
            const input = document.getElementById('search-input').value.trim();
            const items = document.querySelectorAll('.image-container');
            let visibleCount = 0;

            items.forEach(item => {
                const index = item.getAttribute('data-index');
                if (input === '' || index === input || index.includes(input)) {
                    item.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });

            updateCounter(visibleCount, totalLoaded);
        }

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target !== lightboxImg) closeLightbox(); };

        // Tự động khởi chạy
        loadAllImagesDynamically();
    </script>
</body>
</html>
