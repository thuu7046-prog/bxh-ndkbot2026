
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDK BOT - Lịch sử BXH</title>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #030711;
  --cyan: #27e8ff;
  --blue: #147bff;
  --red: #ff253d;
  --text: #eaf7ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background:
    radial-gradient(ellipse at 0% 10%, #ff19351c, transparent 35%),
    radial-gradient(ellipse at 100% 10%, #006aff30, transparent 40%),
    #030711;
  color: var(--text);
  font-family: 'Chakra Petch', sans-serif;
  min-height: 100vh;
  padding: 15px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* HEADER */
.header {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 22px;
  border: 1px solid #1677a8;
  border-radius: 18px;
  background: linear-gradient(110deg, #260912, #030b19 50%, #061c42);
  box-shadow: 0 0 25px #008cff20;
  margin-bottom: 22px;
  text-align: center;
}

.logo {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 20px #008cff66;
}

.brand h1 {
  font: 900 clamp(24px, 5vw, 42px) Orbitron;
  margin: 8px 0;
}

.brand h1 span:first-child { color: var(--red); }
.brand h1 span:last-child { color: var(--cyan); }

.brand p {
  color: #9db9d0;
  letter-spacing: 2px;
  font-size: 12px;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px;
  border: 1px solid #16405d;
  border-left: 3px solid var(--cyan);
  border-radius: 12px;
  background: #071321;
  margin-bottom: 18px;
}

.heading {
  font: 800 clamp(13px, 2.5vw, 19px) Orbitron;
}

.tools {
  display: flex;
  gap: 10px;
}

.search {
  width: 210px;
  padding: 11px;
  border: 1px solid #164e70;
  background: #030b17;
  border-radius: 8px;
  color: white;
  outline: none;
  font: inherit;
}

.search:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 12px #00dfff30;
}

.counter {
  padding: 11px;
  min-width: 90px;
  text-align: center;
  border: 1px solid #087d9c;
  border-radius: 8px;
  color: var(--cyan);
  font: 700 12px Orbitron;
  background: #041625;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px;
  min-width: 0;
  border: 1px solid #163b5a;
  border-radius: 13px;
  background: linear-gradient(120deg, #07172b, #030914);
  transition: .2s;
  position: relative;
  overflow: hidden;
}

.item::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 2px;
  background: linear-gradient(var(--red), var(--cyan));
}

.item:hover {
  transform: translateY(-3px);
  border-color: var(--cyan);
  box-shadow: 0 5px 25px #008cff20;
}

.thumb {
  width: clamp(110px, 17vw, 180px);
  aspect-ratio: 1.48;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid #087eb9;
  border-radius: 9px;
  background: #06101e;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.num {
  position: absolute;
  top: 7px;
  left: 7px;
  padding: 5px 9px;
  background: #04111fee;
  border: 1px solid var(--cyan);
  border-radius: 6px;
  font: 800 12px Orbitron;
}

.details {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.title {
  font: 800 clamp(12px, 1.8vw, 17px) Orbitron;
}

.tag {
  align-self: flex-start;
  padding: 5px 11px;
  border: 1px solid #078baa;
  border-radius: 30px;
  background: #052136;
  color: var(--cyan);
  font-size: 11px;
  font-weight: 700;
}

/* FOOTER */
.footer {
  margin: 28px 0;
  padding: 18px;
  text-align: center;
  border: 1px solid #1474a0;
  border-radius: 12px;
  background: linear-gradient(90deg, #230912, #06152b, #071a35);
  color: var(--cyan);
  font: 800 16px Orbitron;
  letter-spacing: 2px;
  text-shadow: 0 0 12px #00eaff70;
}

.footer span { color: var(--red); }

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #01040df5;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.lightbox.active { display: flex; }

.lightbox img {
  max-width: 95%;
  max-height: 85vh;
  object-fit: contain;
  border: 1px solid var(--cyan);
  border-radius: 10px;
  box-shadow: 0 0 30px #007dff55;
}

.close {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 42px;
  color: var(--cyan);
  background: none;
  border: 0;
  cursor: pointer;
}

.status {
  text-align: center;
  color: #8ba5bd;
  padding: 15px;
  font-size: 12px;
}

/* MOBILE */
@media(max-width:700px) {
  .gallery { grid-template-columns: 1fr; }
  .header { flex-direction: column; }
  .logo { width: 105px; height: 105px; }
  .topbar { align-items: flex-start; }
  .heading { width: 100%; }
  .tools { width: 100%; }
  .search { flex: 1; min-width: 0; }
}

@media(max-width:380px) {
  body { padding: 8px; }
  .item { gap: 9px; padding: 8px; }
  .thumb { width: 41vw; }
}
</style>
</head>

<body>
<main class="container">

  <header class="header">
    <!-- Đặt logo.jpg cùng thư mục HTML -->
    <img src="logo.jpg" class="logo" alt="Logo NDK BOT">

    <div class="brand">
      <p>GAMING • COMMUNITY</p>
      <h1><span>DK</span><span>VL</span><br>STUDIO</h1>
      <p>BOT CHAT · RANKING ARCHIVE</p>
    </div>
  </header>

  <section class="topbar">
    <div class="heading">LỊCH SỬ BẢNG XẾP HẠNG</div>

    <div class="tools">
      <input
        id="search"
        class="search"
        placeholder="Tìm số BXH..."
        type="search"
      >
      <div class="counter" id="counter">0 / 0</div>
    </div>
  </section>

  <section class="gallery" id="gallery"></section>

  <div class="status" id="status">Đang tải ảnh...</div>

  <footer class="footer">
    <span>»</span> NDKBOT THANK YOU <span>«</span>
  </footer>
</main>

<div class="lightbox" id="lightbox">
  <button class="close" id="close">&times;</button>
  <img id="bigImage" alt="BXH chi tiết">
</div>

<script>
const MAX_SCAN = 1000;
const BATCH_SIZE = 60;

const gallery = document.getElementById("gallery");
const counter = document.getElementById("counter");
const statusText = document.getElementById("status");
const search = document.getElementById("search");
const lightbox = document.getElementById("lightbox");
const bigImage = document.getElementById("bigImage");

let allItems = [];

function findImage(index) {
  return new Promise(resolve => {
    const extensions = ["png", "jpg", "jpeg", "webp"];
    let remaining = extensions.length;
    let finished = false;

    extensions.forEach(ext => {
      const src = `${index}.${ext}`;
      const img = new Image();

      img.onload = () => {
        if (!finished) {
          finished = true;
          resolve(src);
        }
      };

      img.onerror = () => {
        remaining--;
        if (remaining === 0 && !finished) {
          resolve(null);
        }
      };

      img.src = src;
    });
  });
}

function createCard(index, src) {
  const card = document.createElement("article");
  card.className = "item";
  card.dataset.index = index;

  const thumb = document.createElement("div");
  thumb.className = "thumb";

  const img = document.createElement("img");
  img.src = src;
  img.alt = `BXH #${index}`;
  img.loading = "eager";
  img.decoding = "async";

  const num = document.createElement("span");
  num.className = "num";
  num.textContent = index;

  thumb.append(img, num);
  thumb.onclick = () => openImage(src);

  const details = document.createElement("div");
  details.className = "details";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = `BXH #${index}`;

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = `BXH #${index}`;

  details.append(title, tag);
  card.append(thumb, details);

  return card;
}

async function loadGallery() {
  gallery.innerHTML = "";
  allItems = [];

  // Quét theo nhóm song song
  for (let start = 1; start <= MAX_SCAN; start += BATCH_SIZE) {
    const end = Math.min(start + BATCH_SIZE - 1, MAX_SCAN);

    const results = await Promise.all(
      Array.from(
        {length: end - start + 1},
        (_, i) => findImage(start + i)
      )
    );

    const fragment = document.createDocumentFragment();

    for (let i = 0; i < results.length; i++) {
      const src = results[i];
      const index = start + i;

      // Mặc định ảnh đánh số liên tục
      if (!src) {
        statusText.textContent =
          `Đã tải ${allItems.length} ảnh BXH.`;
        updateCounter();
        return;
      }

      const item = {index, src};
      allItems.push(item);
      fragment.appendChild(createCard(index, src));
    }

    gallery.appendChild(fragment);
    updateCounter();

    statusText.textContent =
      `Đã tìm thấy ${allItems.length} ảnh BXH...`;
  }

  statusText.textContent = "Đã quét hết danh sách.";
}

function updateCounter() {
  const visible = allItems.filter(item => {
    const q = search.value.trim().replace(/^#/, "");
    return !q || String(item.index).includes(q);
  }).length;

  counter.textContent = `${visible} / ${allItems.length}`;
}

search.addEventListener("input", () => {
  const q = search.value.trim().replace(/^#/, "");

  document.querySelectorAll(".item").forEach(card => {
    card.style.display =
      !q || card.dataset.index.includes(q)
      ? "flex" : "none";
  });

  updateCounter();
});

function openImage(src) {
  bigImage.src = src;
  lightbox.classList.add("active");
}

function closeImage() {
  lightbox.classList.remove("active");
  bigImage.src = "";
}

document.getElementById("close").onclick = closeImage;

lightbox.onclick = e => {
  if (e.target === lightbox) closeImage();
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeImage();
});

loadGallery();
</script>
</body>
</html>
