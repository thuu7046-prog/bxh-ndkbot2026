
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKVL STUDIO - Lịch sử BXH</title>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #030711;
  --cyan: #27e8ff;
  --blue: #147bff;
  --red: #ff253d;
  --text: #eaf7ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  padding: 15px;
  color: var(--text);
  font-family: 'Chakra Petch', sans-serif;
  background:
    radial-gradient(ellipse at 0 10%, #ff193527, transparent 38%),
    radial-gradient(ellipse at 100% 10%, #006aff35, transparent 40%),
    #030711;
}

.container {
  width: min(1200px, 100%);
  margin: auto;
}

/* LOGO HEADER */
.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 30px;
  padding: 25px;
  margin-bottom: 22px;
  border: 1px solid #1b80a9;
  border-radius: 22px;
  background: linear-gradient(
    105deg, #270912, #020916 48%, #061d43
  );
  box-shadow: 0 0 35px #007dff25;
  text-align: center;
}

.logo-frame {
  width: clamp(180px, 28vw, 290px);
  aspect-ratio: 1;
  padding: 5px;
  border-radius: 50%;
  background: conic-gradient(
    var(--red), #050914 28%,
    var(--cyan) 52%, #050914 75%,
    var(--red)
  );
  box-shadow:
    0 0 25px #ff253d55,
    0 0 45px #147bff55;
}

.logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
  border: 3px solid #030711;
}

.brand small {
  color: #b6d5e8;
  font: 700 11px Orbitron;
  letter-spacing: 4px;
}

.brand h1 {
  font: 900 clamp(30px, 6vw, 55px) Orbitron;
  margin: 14px 0;
  line-height: 1.2;
  text-shadow: 0 0 20px #00dfff44;
}

.brand h1 .red { color: #ff3048; }
.brand h1 .blue { color: #31bdff; }

.brand p {
  color: #b1c8dc;
  letter-spacing: 2px;
  font-size: 13px;
}

/* THANH TÌM KIẾM */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  padding: 17px;
  margin-bottom: 20px;
  border: 1px solid #16405d;
  border-left: 4px solid var(--cyan);
  border-radius: 13px;
  background: #071321;
}

.heading {
  font: 800 clamp(13px, 2.3vw, 20px) Orbitron;
}

.tools {
  display: flex;
  gap: 10px;
}

.search {
  width: 220px;
  max-width: 52vw;
  padding: 12px;
  color: white;
  background: #030b17;
  border: 1px solid #164e70;
  border-radius: 9px;
  outline: none;
  font: inherit;
}

.search:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 12px #00dfff30;
}

.counter {
  padding: 12px;
  min-width: 90px;
  text-align: center;
  border: 1px solid #087d9c;
  border-radius: 9px;
  color: var(--cyan);
  background: #041625;
  font: 700 12px Orbitron;
}

/* DANH SÁCH BXH */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.item {
  display: flex;
  align-items: center;
  gap: 18px;
  min-width: 0;
  padding: 14px;
  border: 1px solid #163b5a;
  border-radius: 15px;
  background: linear-gradient(120deg, #07172b, #030914);
  transition: .2s;
}

.item:hover {
  transform: translateY(-3px);
  border-color: var(--cyan);
  box-shadow: 0 8px 28px #008cff25;
}

.thumb {
  position: relative;
  width: clamp(170px, 22vw, 260px);
  aspect-ratio: 1.38;
  flex-shrink: 0;
  overflow: hidden;
  cursor: zoom-in;
  border: 1px solid #0e9fce;
  border-radius: 11px;
  background: #06101e;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.num {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 6px 10px;
  background: #04111fee;
  border: 1px solid var(--cyan);
  border-radius: 7px;
  font: 800 13px Orbitron;
}

.details {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.title {
  font: 800 clamp(14px, 1.8vw, 19px) Orbitron;
  color: white;
}

.tag {
  align-self: flex-start;
  padding: 6px 13px;
  border: 1px solid #078baa;
  border-radius: 30px;
  background: #052136;
  color: var(--cyan);
  font-size: 12px;
  font-weight: 700;
}

/* CHÂN TRANG */
.footer {
  margin: 30px 0;
  padding: 20px 12px;
  text-align: center;
  border: 1px solid #1474a0;
  border-radius: 13px;
  background: linear-gradient(90deg, #230912, #06152b, #071a35);
  color: var(--cyan);
  font: 800 clamp(13px, 2.3vw, 18px) Orbitron;
  letter-spacing: 2px;
  text-shadow: 0 0 12px #00eaff70;
}

.footer span { color: var(--red); }

.status {
  text-align: center;
  color: #8ba5bd;
  padding: 15px;
  font-size: 12px;
}

/* PHÓNG TO ẢNH */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: #01040df7;
  backdrop-filter: blur(10px);
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 98vw;
  max-height: 92vh;
  object-fit: contain;
  border: 1px solid var(--cyan);
  border-radius: 10px;
  box-shadow: 0 0 38px #007dff55;
}

.close {
  position: absolute;
  right: 15px;
  top: 8px;
  width: 48px;
  height: 48px;
  color: var(--cyan);
  font-size: 40px;
  background: #06111d;
  border: 1px solid #155b7b;
  border-radius: 10px;
  cursor: pointer;
}

/* ĐIỆN THOẠI */
@media (max-width: 760px) {
  .gallery {
    grid-template-columns: 1fr;
  }

  .hero {
    padding: 22px 12px;
    gap: 17px;
  }

  .logo-frame {
    width: clamp(160px, 47vw, 230px);
  }

  .topbar {
    align-items: flex-start;
  }

  .heading {
    width: 100%;
  }

  .tools {
    width: 100%;
  }

  .search {
    flex: 1;
    width: auto;
    max-width: none;
  }

  .thumb {
    width: clamp(155px, 43vw, 245px);
  }
}

@media (max-width: 390px) {
  body { padding: 8px; }
  .item { gap: 10px; padding: 9px; }
  .thumb { width: 43vw; }
}
</style>
</head>

<body>
<main class="container">

  <!-- LOGO -->
  <header class="hero">
    <div class="logo-frame">
      <!-- Đặt ảnh logo.jpg cạnh file HTML -->
      <img src="logo.jpg" class="logo" alt="DKVL STUDIO">
    </div>

    <div class="brand">
      <small>GAMING • COMMUNITY</small>
      <h1>
        <span class="red">DK</span><span class="blue">VL</span>
        <br>STUDIO
      </h1>
      <p>BOT CHAT · RANKING ARCHIVE</p>
    </div>
  </header>

  <!-- THANH TÌM KIẾM -->
  <section class="topbar">
    <div class="heading">LỊCH SỬ BẢNG XẾP HẠNG</div>

    <div class="tools">
      <input
        id="search"
        class="search"
        placeholder="Tìm số BXH..."
        type="search"
      >
      <div class="counter" id="counter">0 / 0</div>
    </div>
  </section>

  <!-- DANH SÁCH ẢNH -->
  <section class="gallery" id="gallery"></section>
  <div class="status" id="status">Đang tải ảnh...</div>

  <footer class="footer">
    <span>»</span> NDKBOT THANK YOU <span>«</span>
  </footer>

</main>

<!-- XEM ẢNH LỚN -->
<div class="lightbox" id="lightbox">
  <button class="close" id="close">&times;</button>
  <img id="bigImage" alt="BXH chi tiết">
</div>

<script>
const MAX_SCAN = 1000;
const BATCH_SIZE = 60;

const gallery = document.getElementById("gallery");
const counter = document.getElementById("counter");
const statusText = document.getElementById("status");
const search = document.getElementById("search");
const lightbox = document.getElementById("lightbox");
const bigImage = document.getElementById("bigImage");

let allItems = [];

// Tìm ảnh theo định dạng
function findImage(index) {
  return new Promise(resolve => {
    const extensions = ["png", "jpg", "jpeg", "webp"];
    let remaining = extensions.length;
    let finished = false;

    extensions.forEach(ext => {
      const src = `${index}.${ext}`;
      const img = new Image();

      img.onload = () => {
        if (!finished) {
          finished = true;
          resolve(src);
        }
      };

      img.onerror = () => {
        remaining--;
        if (remaining === 0 && !finished) {
          resolve(null);
        }
      };

      img.src = src;
    });
  });
}

// Tạo thẻ BXH
function createCard(index, src) {
  const card = document.createElement("article");
  card.className = "item";
  card.dataset.index = index;

  const thumb = document.createElement("div");
  thumb.className = "thumb";

  const img = document.createElement("img");
  img.src = src;
  img.alt = `BXH #${index}`;
  img.loading = "eager";
  img.decoding = "async";

  const num = document.createElement("span");
  num.className = "num";
  num.textContent = index;

  thumb.append(img, num);
  thumb.onclick = () => openImage(src);

  const details = document.createElement("div");
  details.className = "details";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = `BXH #${index}`;

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = `BXH #${index}`;

  details.append(title, tag);
  card.append(thumb, details);

  return card;
}

// Tải danh sách theo nhóm
async function loadGallery() {
  gallery.innerHTML = "";
  allItems = [];

  for (let start = 1; start <= MAX_SCAN; start += BATCH_SIZE) {
    const end = Math.min(
      start + BATCH_SIZE - 1,
      MAX_SCAN
    );

    const results = await Promise.all(
      Array.from(
        { length: end - start + 1 },
        (_, i) => findImage(start + i)
      )
    );

    const fragment = document.createDocumentFragment();

    for (let i = 0; i < results.length; i++) {
      const src = results[i];
      const index = start + i;

      // Dãy số liên tục
      if (!src) {
        gallery.appendChild(fragment);

        statusText.textContent =
          `Đã tải ${allItems.length} ảnh BXH.`;

        if (!allItems.length) {
          gallery.innerHTML =
            '<div class="empty">Chưa có ảnh BXH.</div>';
        }

        updateCounter();
        return;
      }

      allItems.push({ index, src });
      fragment.appendChild(createCard(index, src));
    }

    gallery.appendChild(fragment);
    updateCounter();

    statusText.textContent =
      `Đã tìm thấy ${allItems.length} ảnh BXH...`;
  }
}

// Tìm kiếm BXH
function updateCounter() {
  const q = search.value.trim().replace(/^#/, "");

  const visible = allItems.filter(item =>
    !q || String(item.index).includes(q)
  ).length;

  counter.textContent = `${visible} / ${allItems.length}`;
}

search.addEventListener("input", () => {
  const q = search.value.trim().replace(/^#/, "");

  document.querySelectorAll(".item").forEach(card => {
    card.style.display =
      !q || card.dataset.index.includes(q)
        ? "flex"
        : "none";
  });

  updateCounter();
});

// Phóng to ảnh
function openImage(src) {
  bigImage.src = src;
  lightbox.classList.add("active");
}

function closeImage() {
  lightbox.classList.remove("active");
  bigImage.src = "";
}

document.getElementById("close").onclick = closeImage;

lightbox.onclick = e => {
  if (e.target === lightbox) closeImage();
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeImage();
});

// Hạn chế thao tác thông thường
document.addEventListener("contextmenu", e => {
  e.preventDefault();
});

document.addEventListener("dragstart", e => {
  e.preventDefault();
});

document.addEventListener("keydown", e => {
  if (
    (e.ctrlKey || e.metaKey) &&
    ["s", "u"].includes(e.key.toLowerCase())
  ) {
    e.preventDefault();
  }
});

loadGallery();
</script>
</body>
</html>
