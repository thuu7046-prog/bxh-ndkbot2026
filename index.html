<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090c">
<title>DKVL STUDIO | Gaming Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09090c; --panel:#13131a; --line:#2a2a38;
    --text:#f2f2f7; --muted:#8b8ba0;
    --accent:#ff7a18; --accent2:#ff2e63; --cyan:#22d3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Rajdhani',system-ui,sans-serif; font-size:18px;
    min-height:100vh; overflow-x:hidden;
  }

  /* ===== NỀN ===== */
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,122,24,.18), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(255,46,99,.16), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,211,238,.12), transparent 45%);
  }
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(circle at 50% 30%, #000, transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%, #000, transparent 75%);
  }

  /* ===== NHÂN VẬT NỀN ===== */
  .char{
    position:fixed; z-index:0; pointer-events:none;
    width:clamp(150px,22vw,320px); aspect-ratio:3/5;
    opacity:.28; filter:drop-shadow(0 0 25px var(--c));
    animation:float 6s ease-in-out infinite;
    display:flex;flex-direction:column;align-items:center;
  }
  .char svg,.char img{width:100%;height:100%;object-fit:contain}
  .char span{
    font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.3em;
    font-size:.8rem;color:var(--c);margin-top:-6px;text-shadow:0 0 10px var(--c);
  }
  .char.oscar{--c:#ff7a18; left:-2%; bottom:0}
  .char.hayato{--c:#ff2e63; right:-2%; top:12%; animation-delay:-2s}
  .char.kelly{--c:#22d3ee; right:18%; bottom:-2%; animation-delay:-4s; opacity:.2}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @media(max-width:700px){.char{opacity:.15}.char.kelly{display:none}}

  /* ===== NỘI DUNG ===== */
  .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px}

  header{
    position:sticky;top:0;z-index:5;
    backdrop-filter:blur(12px);background:rgba(9,9,12,.7);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
  .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.12em}
  .logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .live{font-size:.8rem;color:var(--muted);letter-spacing:.2em;display:flex;align-items:center;gap:8px}
  .live i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 1.5s infinite}
  @keyframes pulse{50%{opacity:.3}}

  .hero{text-align:center;padding:90px 0 50px}
  .eyebrow{color:var(--accent);letter-spacing:.4em;font-size:.8rem;font-weight:700}
  .sub{color:var(--muted);letter-spacing:.3em;font-size:.8rem;margin:6px 0 18px}
  h1{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(2.6rem,9vw,6rem);line-height:1;letter-spacing:.04em;
    background:linear-gradient(90deg,#fff,var(--accent) 50%,var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 25px rgba(255,122,24,.35));
  }
  .hero p{color:var(--muted);margin-top:16px;font-size:1.1rem}

  /* Tabs */
  .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 40px}
  .tab{
    font-family:inherit;font-weight:700;font-size:1rem;letter-spacing:.08em;
    padding:10px 22px;border-radius:999px;cursor:pointer;
    background:var(--panel);color:var(--muted);border:1px solid var(--line);transition:.25s;
  }
  .tab:hover{color:var(--text);border-color:var(--accent)}
  .tab.active{
    color:#fff;border-color:transparent;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 22px rgba(255,46,99,.4);
  }

  h2{font-family:'Orbitron',sans-serif;letter-spacing:.2em;font-size:1rem;color:var(--muted);margin-bottom:20px}
  h2::after{content:"";display:block;width:60px;height:3px;margin-top:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px}

  /* Gallery */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:80px}
  .card{
    position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);
    transition:transform .3s,box-shadow .3s,border-color .3s;
    animation:in .5s both;
  }
  @keyframes in{from{opacity:0;transform:translateY(20px)}}
  .card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--accent);box-shadow:0 12px 40px rgba(255,122,24,.25)}
  .card .art{position:absolute;inset:0;background-size:cover;background-position:center}
  .card .art.ph{display:flex;align-items:center;justify-content:center;
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.4rem;color:rgba(255,255,255,.18)}
  .card .info{
    position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.85));
  }
  .card .info b{display:block;font-size:1.1rem}
  .card .info small{color:var(--accent);letter-spacing:.15em;font-weight:700}

  footer{position:relative;z-index:1;text-align:center;padding:30px 20px;color:var(--muted);
    border-top:1px solid var(--line);font-size:.85rem;letter-spacing:.15em;background:rgba(9,9,12,.8)}

  /* Lightbox */
  .lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  .lb.open{display:flex}
  .lb .view{width:min(900px,92vw);aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:1px solid var(--accent);
    box-shadow:0 0 60px rgba(255,122,24,.3);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:3rem;color:rgba(255,255,255,.2)}
  .lb .cap{color:var(--muted);letter-spacing:.2em}
  .lb button{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.2em;padding:12px 28px;border-radius:999px;
    border:1px solid var(--accent2);background:transparent;color:#fff;cursor:pointer;transition:.25s}
  .lb button:hover{background:var(--accent2);box-shadow:0 0 25px var(--accent2)}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<!-- ===== 3 NHÂN VẬT NỀN =====
     Muốn dùng ảnh thật: điền link PNG nền trong suốt vào CHAR_IMAGES ở phần script -->
<div class="char oscar" id="char-oscar">
  <svg viewBox="0 0 120 200" fill="var(--c)">
    <circle cx="60" cy="38" r="20"/>
    <path d="M36 30 Q60 4 84 30 L84 36 Q60 24 36 36Z"/>            <!-- mũ -->
    <path d="M30 70 Q60 56 90 70 L100 140 L82 142 L78 190 L42 190 L38 142 L20 140Z"/>
    <rect x="86" y="96" width="8" height="52" rx="3"/>             <!-- vũ khí -->
  </svg>
  <span>OSCAR</span>
</div>

<div class="char hayato" id="char-hayato">
  <svg viewBox="0 0 120 200" fill="var(--c)">
    <circle cx="60" cy="38" r="19"/>
    <path d="M44 22 L50 4 L58 20 L66 2 L74 22Z"/>                  <!-- tóc nhọn -->
    <path d="M32 70 Q60 58 88 70 L96 138 L80 140 L76 190 L44 190 L40 140 L24 138Z"/>
    <path d="M14 60 L22 60 L30 150 L24 150Z"/>                     <!-- katana -->
  </svg>
  <span>HAYATO</span>
</div>

<div class="char kelly" id="char-kelly">
  <svg viewBox="0 0 120 200" fill="var(--c)">
    <circle cx="60" cy="38" r="19"/>
    <path d="M40 34 Q36 80 46 96 L50 50Z"/>                        <!-- tóc dài -->
    <path d="M80 34 Q84 80 74 96 L70 50Z"/>
    <path d="M36 70 Q60 58 84 70 L90 130 L76 134 L74 190 L46 190 L44 134 L30 130Z"/>
  </svg>
  <span>KELLY</span>
</div>

<header>
  <div class="wrap">
    <div class="logo"><b>DKVL</b>.STUDIO</div>
    <div class="live"><i></i>ONLINE</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">GAMING CREATIVE</div>
    <div class="sub">YOUR VISUAL COLLECTION</div>
    <h1>MY GALLERY</h1>
    <p>All your designs. One destination.</p>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-f="all">Tất cả</button>
    <button class="tab" data-f="bxh">BXH</button>
    <button class="tab" data-f="banner">Banner</button>
    <button class="tab" data-f="profile">Profile</button>
    <button class="tab" data-f="lineup">Lineup</button>
  </nav>

  <h2>THƯ VIỆN ẢNH</h2>
  <section class="grid" id="grid"></section>
</main>

<footer>© 2026 DKVL STUDIO GALLERY · GAMING COMMUNITY</footer>

<!-- Lightbox -->
<div class="lb" id="lb">
  <div class="view" id="lbView"></div>
  <div class="cap" id="lbCap">Ảnh đang xem</div>
  <button id="lbClose">ĐÓNG ✕</button>
</div>

<script>
  /* ====== ẢNH NHÂN VẬT (tuỳ chọn) ======
     Dán link ảnh PNG của bạn vào đây, ví dụ: oscar: "images/oscar.png" */
  const CHAR_IMAGES = { oscar: "", hayato: "", kelly: "" };
  Object.entries(CHAR_IMAGES).forEach(([k, src]) => {
    if (!src) return;
    const el = document.getElementById("char-" + k);
    el.querySelector("svg").outerHTML = `<img src="${src}" alt="${k}">`;
  });

  /* ====== DANH SÁCH ẢNH ======
     Thêm ảnh thật: { cat:"banner", title:"Tên", src:"images/anh1.jpg" } */
  const ITEMS = [
    { cat:"bxh",     title:"BXH Tuần 1",       src:"" },
    { cat:"bxh",     title:"BXH Tháng 10",     src:"" },
    { cat:"banner",  title:"Banner Giải Đấu",  src:"" },
    { cat:"banner",  title:"Banner Sự Kiện",   src:"" },
    { cat:"profile", title:"Profile Oscar",    src:"" },
    { cat:"profile", title:"Profile Hayato",   src:"" },
    { cat:"profile", title:"Profile Kelly",    src:"" },
    { cat:"lineup",  title:"Lineup Squad A",   src:"" },
    { cat:"lineup",  title:"Lineup Squad B",   src:"" },
  ];
  const NAMES = { bxh:"BXH", banner:"BANNER", profile:"PROFILE", lineup:"LINEUP" };
  const GRADS = [
    "linear-gradient(135deg,#ff7a18,#af002d)",
    "linear-gradient(135deg,#22d3ee,#4f46e5)",
    "linear-gradient(135deg,#ff2e63,#6d28d9)",
    "linear-gradient(135deg,#f59e0b,#ef4444)",
  ];

  const grid = document.getElementById("grid");
  const lb = document.getElementById("lb");
  const lbView = document.getElementById("lbView");
  const lbCap = document.getElementById("lbCap");

  function artStyle(it, i){
    return it.src ? `background-image:url('${it.src}')` : `background:${GRADS[i % GRADS.length]}`;
  }

  function render(filter = "all"){
    grid.innerHTML = "";
    ITEMS.map((it, i) => ({ ...it, i }))
      .filter(it => filter === "all" || it.cat === filter)
      .forEach((it, n) => {
        const d = document.createElement("div");
        d.className = "card";
        d.style.animationDelay = (n * 60) + "ms";
        d.innerHTML = `
          <div class="art ${it.src ? "" : "ph"}" style="${artStyle(it, it.i)}">${it.src ? "" : "DKVL"}</div>
          <div class="info"><small>${NAMES[it.cat]}</small><b>${it.title}</b></div>`;
        d.onclick = () => openLb(it);
        grid.appendChild(d);
      });
  }

  function openLb(it){
    lbView.style.cssText = artStyle(it, it.i);
    lbView.textContent = it.src ? "" : "DKVL STUDIO";
    lbCap.textContent = it.title;
    lb.classList.add("open");
  }
  const closeLb = () => lb.classList.remove("open");
  document.getElementById("lbClose").onclick = closeLb;
  lb.onclick = e => { if (e.target === lb) closeLb(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    b.classList.add("active");
    render(b.dataset.f);
  });

  render();
</script>
</body>
    </html>
